<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Vertaalbot</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5865F2"/>
      <stop offset="1" stop-color="#9B4DF5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5CF2C2"/>
      <stop offset="1" stop-color="#1FBF93"/>
    </linearGradient>
    <radialGradient id="bulb" cx="0.4" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#FFF8C4"/>
      <stop offset="1" stop-color="#FEE75C"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1A1054" flood-opacity="0.35"/>
    </filter>
    <filter id="halo" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- achtergrond -->
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#glow)"/>

  <!-- sterretjes -->
  <g fill="#FEE75C">
    <path d="M820 170 q10 52 62 62 q-52 10 -62 62 q-10 -52 -62 -62 q52 -10 62 -62z"/>
    <path d="M880 330 q5 26 31 31 q-26 5 -31 31 q-5 -26 -31 -31 q26 -5 31 -31z" opacity="0.8"/>
    <path d="M160 840 q6 32 38 38 q-32 6 -38 38 q-6 -32 -38 -38 q32 -6 38 -38z" opacity="0.7"/>
  </g>

  <!-- linker ballon: de bot (met antenne) -->
  <g filter="url(#shadow)">
    <line x1="400" y1="250" x2="400" y2="168" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
    <circle cx="400" cy="150" r="48" fill="#FEE75C" filter="url(#halo)" opacity="0.7"/>
    <circle cx="400" cy="150" r="34" fill="url(#bulb)"/>
    <path fill="#FFFFFF" d="M330 240 H470 A150 150 0 0 1 620 390 V470 A150 150 0 0 1 470 620 H330 L230 700 L262 600 A150 150 0 0 1 180 470 V390 A150 150 0 0 1 330 240 Z"/>
  </g>
  <!-- letter A -->
  <g fill="none" stroke="#5865F2" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 520 L375 335 L450 520"/>
    <path d="M327 462 H423"/>
  </g>

  <!-- rechter ballon: 文 -->
  <g filter="url(#shadow)">
    <path fill="url(#mint)" stroke="#7458F4" stroke-width="26" stroke-linejoin="round"
          d="M620 460 H720 A140 140 0 0 1 860 600 V660 A140 140 0 0 1 790 781 L830 870 L700 800 H620 A140 140 0 0 1 480 660 V600 A140 140 0 0 1 620 460 Z"/>
  </g>
  <g fill="none" stroke="#1B1D4D" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <path d="M670 528 L676 552"/>
    <path d="M590 582 H760"/>
    <path d="M730 600 Q690 700 600 745"/>
    <path d="M622 605 Q660 700 752 745"/>
  </g>

</svg>
