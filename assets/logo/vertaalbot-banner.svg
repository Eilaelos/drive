<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 480" width="1360" height="480">
  <title>Vertaalbot banner</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5865F2"/><stop offset="1" stop-color="#9B4DF5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5CF2C2"/><stop offset="1" stop-color="#1FBF93"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1A1054" flood-opacity="0.3"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#FFFFFF" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1360" height="480" fill="url(#bg)"/>
  <rect width="1360" height="480" fill="url(#dots)"/>
  <rect width="1360" height="480" fill="url(#glow)"/>
  <!-- golvende "vertaalstroom" -->
  <path d="M0 400 C 250 330, 420 470, 700 390 S 1150 300, 1360 360" fill="none" stroke="#5CF2C2" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 16"/>
  <g font-family="Inter, 'IPAGothic', 'DejaVu Sans', sans-serif" font-weight="700">
  <g transform="rotate(-6 165 98)" filter="url(#sh)">
    <g fill="#FFFFFF" fill-opacity="1"><rect x="90" y="70" width="150" height="57" rx="28"/><path d="M112.8 125.0 L104.25 145.0 L141.3 125.0Z"/></g>
    <text x="165" y="109" font-size="30" fill="#5865F2" fill-opacity="1" text-anchor="middle">Hallo!</text>
  </g>
  <g transform="rotate(4 387 135)">
    <g fill="#FFFFFF" fill-opacity="0.14"><rect x="330" y="110" width="114" height="49" rx="25"/><path d="M424.64 157.4 L432.04999999999995 175.0 L399.94 157.4Z"/></g>
    <text x="387" y="144" font-size="26" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">Hello</text>
  </g>
  <g transform="rotate(-3 217 198)">
    <g fill="#FFFFFF" fill-opacity="0.14"><rect x="150" y="175" width="134" height="46" rx="23"/><path d="M168.24 218.6 L161.4 235.0 L191.04 218.6Z"/></g>
    <text x="217" y="206" font-size="24" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">Bonjour</text>
  </g>
  <g transform="rotate(5 603 85)" filter="url(#sh)">
    <g fill="url(#mint)" fill-opacity="1"><rect x="520" y="60" width="166" height="49" rx="25"/><path d="M666.64 107.4 L674.05 125.0 L641.9399999999999 107.4Z"/></g>
    <text x="603" y="94" font-size="26" fill="#1B1D4D" fill-opacity="1" text-anchor="middle">こんにちは</text>
  </g>
  <g transform="rotate(-5 495 244)" filter="url(#sh)">
    <g fill="url(#mint)" fill-opacity="1"><rect x="420" y="215" width="150" height="57" rx="28"/><path d="M442.8 270.0 L434.25 290.0 L471.3 270.0Z"/></g>
    <text x="495" y="254" font-size="30" fill="#1B1D4D" fill-opacity="1" text-anchor="middle">¡Hola!</text>
  </g>
  <g transform="rotate(3 945 66)">
    <g fill="#FFFFFF" fill-opacity="0.14"><rect x="890" y="45" width="110" height="42" rx="21"/><path d="M983.28 84.8 L989.55 100.0 L962.38 84.8Z"/></g>
    <text x="945" y="74" font-size="22" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">Привет</text>
  </g>
  <g transform="rotate(-4 812 73)">
    <g fill="#FFFFFF" fill-opacity="0.14"><rect x="770" y="52" width="84" height="42" rx="21"/><path d="M786.72 91.8 L780.45 107.0 L807.62 91.8Z"/></g>
    <text x="812" y="81" font-size="22" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">Ciao</text>
  </g>
  <g transform="rotate(5 368 321)">
    <g fill="#FFFFFF" fill-opacity="0.14"><rect x="300" y="300" width="136" height="42" rx="21"/><path d="M419.67999999999995 339.8 L425.95 355.0 L398.78 339.8Z"/></g>
    <text x="368" y="329" font-size="22" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">Γειά σου</text>
  </g>
  <g transform="rotate(-4 598 353)" filter="url(#sh)">
    <g fill="#FFFFFF" fill-opacity="1"><rect x="560" y="330" width="77" height="46" rx="23"/><path d="M578.24 373.6 L571.4 390.0 L601.04 373.6Z"/></g>
    <text x="598" y="361" font-size="24" fill="#5865F2" fill-opacity="1" text-anchor="middle">Olá</text>
  </g>
  <g transform="rotate(3 762 416)">
    <g fill="#FFFFFF" fill-opacity="0.14"><rect x="700" y="395" width="123" height="42" rx="21"/><path d="M806.48 434.8 L812.75 450.0 L785.58 434.8Z"/></g>
    <text x="762" y="424" font-size="22" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">Merhaba</text>
  </g>
  <g transform="rotate(-6 502 444)">
    <g fill="#FFFFFF" fill-opacity="0.14"><rect x="470" y="425" width="64" height="38" rx="19"/><path d="M485.2 461.0 L479.5 475.0 L504.2 461.0Z"/></g>
    <text x="502" y="451" font-size="20" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">Hej</text>
  </g>
  </g>
  <!-- sterretjes -->
  <g fill="#FEE75C">
    <path d="M1250 60 q8 40 48 48 q-40 8 -48 48 q-8 -40 -48 -48 q40 -8 48 -48z"/>
    <path d="M905 380 q4 22 26 26 q-22 4 -26 26 q-4 -22 -26 -26 q22 -4 26 -26z" opacity="0.8"/>
  </g>
  <!-- woordmerk -->
  <g font-family="'Inter Display', Inter, sans-serif" text-anchor="end">
    <text x="1290" y="255" font-size="118" font-weight="900" fill="#FFFFFF" letter-spacing="-3">Vertaal<tspan fill="#FEE75C">bot</tspan></text>
    <text x="1290" y="318" font-size="34" font-weight="600" fill="#FFFFFF" fill-opacity="0.85">Elke taal. Eén server.</text>
  </g>
</svg>
